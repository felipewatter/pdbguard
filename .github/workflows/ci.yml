name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check source syntax
        shell: bash
        run: python -m compileall -q src tests
      - name: Unit and adversarial regression tests
        shell: bash
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Build and install package
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps . -w dist
          python -m pip install --no-deps dist/*.whl
      - name: CLI smoke test
        shell: bash
        run: |
          pdbguard --version
          pdbguard plan examples/snapshot.json --nodes worker-a worker-d --format json --out smoke.json
          python -c "import json; r=json.load(open('smoke.json',encoding='utf-8')); assert r['summary']['selected']==2 and r['advisoryOnly']"
